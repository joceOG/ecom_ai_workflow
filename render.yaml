services:
  - type: web
    name: kidishop-front
    runtime: node
    plan: starter
    buildCommand: npm install --legacy-peer-deps --no-audit --no-fund && npm run build
    startCommand: npm run start
    healthCheckPath: /api/meta
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.23.3
      - key: NUXT_TELEMETRY_DISABLED
        value: 1
